name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable annotated tag to release (main only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  TMPDIR: ${{ github.workspace }}/tmp/work
  GOCACHE: ${{ github.workspace }}/tmp/go-cache
  GOTOOLCHAIN: go1.25.0

jobs:
  validate:
    name: Validate release eligibility
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      build_time: ${{ steps.validate.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select source and validate annotated tag and exact main CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          mkdir -p "$TMPDIR"
          python3 -B scripts/release/select_source.py

  build:
    name: Test Linux ${{ matrix.arch }} artifacts
    timeout-minutes: 45
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Initialize temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: docker/setup-buildx-action@v3
      - name: Build local single-platform release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: optimus:release-${{ matrix.arch }}
          build-args: VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit }}
            org.opencontainers.image.created=${{ needs.validate.outputs.build_time }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/ArkGravity/optimus
      - name: Verify image, native binary and extracted Compose package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$TMPDIR"
          docker compose version
          docker pull postgres:17-alpine
          bash scripts/release/prepare.sh "optimus:release-$ARCH" "$VERSION" "$ARCH" "tmp/release/artifacts/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: tmp/release/artifacts/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish verified images and prepare Release draft
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [validate, build]
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'logic3579' }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'logic3579' }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Recheck eligibility before publication
        run: |
          mkdir -p "$TMPDIR"
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$VERSION" GITHUB_SHA="$COMMIT" bash scripts/release/validate.sh
      - uses: actions/download-artifact@v4
        with:
          name: release-amd64
          path: tmp/release/inputs/amd64
      - uses: actions/download-artifact@v4
        with:
          name: release-arm64
          path: tmp/release/inputs/arm64
      - name: Verify inputs and assemble release attachments
        run: |
          mkdir -p "$TMPDIR"
          python3 -B scripts/release/package.py assemble --version "$VERSION" --input tmp/release/inputs --output tmp/release/dist --epoch "$(git show -s --format=%ct HEAD)"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned registry tool
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp/release-tools"
          GOBIN="$GITHUB_WORKSPACE/tmp/release-tools" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          echo "$GITHUB_WORKSPACE/tmp/release-tools" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_NAMESPACE" && test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact smoke-tested image bytes
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$VERSION" GITHUB_SHA="$COMMIT" bash scripts/release/publish.sh --version "$VERSION" --commit "$COMMIT" --input tmp/release/inputs --output tmp/release/dist --dockerhub "docker.io/$DOCKERHUB_NAMESPACE/optimus"
      - name: Checksums and draft attachments
        run: |
          python3 -B scripts/release/package.py sums --version "$VERSION" --output tmp/release/dist
          python3 -B scripts/release/package.py verify --version "$VERSION" --output tmp/release/dist
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$VERSION" GITHUB_SHA="$COMMIT" python3 -B scripts/release/draft.py --version "$VERSION" --artifacts tmp/release/dist

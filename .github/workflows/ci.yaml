name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOCACHE: ${{ github.workspace }}/tmp/go-cache
  GOLANGCI_LINT_CACHE: ${{ github.workspace }}/tmp/golangci-lint-cache

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            tmp/go-cache
            tmp/golangci-lint-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.25-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.25-${{ hashFiles('go.sum') }}-

      - name: go mod download
        run: go mod download

      - name: install tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.7

      - name: CI change classifier tests
        run: python3 -B -m unittest discover -s scripts -p test_ci_changes.py

      - name: lint
        run: make lint

      - name: swagger-diff
        run: make swagger-diff

      - name: perm-check
        run: make perm-check

      - name: gosec
        run: gosec -severity medium -confidence medium -quiet ./...

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            tmp/go-cache
            tmp/golangci-lint-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.25-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.25-${{ hashFiles('go.sum') }}-

      - name: go mod download
        run: go mod download

      - name: unit tests
        run: make test

  backend-dbtest:
    name: Backend database tests
    outputs:
      run: ${{ steps.changes.outputs.run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-changes.py
      - name: Start shared test PostgreSQL
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --name optimus-ci-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test postgres:17-alpine
          for attempt in {1..60}; do
            if docker exec optimus-ci-postgres pg_isready -h 127.0.0.1 -U test -d test; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.run == 'true'
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/cache@v4
        if: steps.changes.outputs.run == 'true'
        with:
          path: |
            ~/go/pkg/mod
            tmp/go-cache
            tmp/golangci-lint-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.25-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.25-${{ hashFiles('go.sum') }}-

      - name: go mod download
        if: steps.changes.outputs.run == 'true'
        run: go mod download

      - name: dbtest (isolated databases on shared Postgres)
        if: steps.changes.outputs.run == 'true'
        env:
          OPTIMUS_TEST_POSTGRES_DSN: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
        run: make test-int
      - name: Stop test PostgreSQL
        if: always() && steps.changes.outputs.run == 'true'
        run: docker rm -f optimus-ci-postgres

  image-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-changes.py
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.run == 'true'
      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.run == 'true'
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VERSION=${{ github.sha }}

  image:
    name: Publish image to GHCR and Docker Hub
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.backend-dbtest.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-unit, backend-dbtest, image-build]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'logic3579' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check publishing configuration
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '::error::Set DOCKERHUB_USERNAME variable'; exit 1; }
          test -n "$DOCKERHUB_NAMESPACE" || { echo '::error::Set DOCKERHUB_NAMESPACE variable'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '::error::Set DOCKERHUB_TOKEN secret'; exit 1; }
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/optimus-be,enable=${{ env.PUBLISH == 'true' }}
          tags: type=sha,prefix=${{ github.ref_name }}-,format=short
      - name: Build image (publish main to both registries)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VERSION=${{ github.sha }}

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  shutdown_timeout: 20s
  # Proxy IPs/CIDRs allowed to set X-Forwarded-For; empty trusts none.
  trusted_proxies: []
  # Serve the web UI from this directory instead of the embedded build.
  web_dir: ""

database:
  driver: postgres
  dsn: "host=localhost port=5432 user=optimus password=optimus dbname=optimus sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h

jwt:
  # Local development only; same value as docker-compose.yml.
  # Set OPTIMUS_JWT_SECRET to a unique 32+ byte secret outside local Dev.
  secret: "dev-only-jwt-secret-at-least-32-bytes"
  access_ttl: 15m
  refresh_ttl: 168h

auth:
  bcrypt_cost: 10
  login_rate_limit:
    per_ip: 5
    per_username: 5
    window: 1m
    block: 1m

log:
  level: info
  format: json
  output: stdout

cors:
  allowed_origins: ["http://localhost:5173"]
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_credentials: false

i18n:
  default_lang: zh-CN
  supported: ["zh-CN", "en-US"]

bootstrap:
  admin_username: admin
  admin_email: admin@example.com

vault:
  # Local development only; base64 of 32 bytes, same value as docker-compose.yml.
  # Set OPTIMUS_VAULT_MASTER_KEY (or OPTIMUS_VAULT_MASTER_KEY_FILE) to a unique
  # backed-up key outside local Dev. Losing it makes encrypted credentials unrecoverable.
  master_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  master_key_file: ""

assets:
  sync_cron: "*/15 * * * *"
  sync_startup_delay: 30s
  sync_run_retention_days: 90
  aws_request_timeout: 30s

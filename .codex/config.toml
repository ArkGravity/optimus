[mcp_servers.mem0]
# Mem0 is consumed through its hosted Streamable HTTP endpoint. Callers scope
# writes and reads to user_id = "logic" and native app_id = "optimus", per AGENTS.md.
url = "https://mcp.mem0.ai/mcp"
bearer_token_env_var = "MEM0_API_KEY"
startup_timeout_sec = 15
tool_timeout_sec = 60
default_tools_approval_mode = "approve" # auto / prompt / approve

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true
